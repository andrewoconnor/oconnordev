[tools]
opentofu = "1.13.1"
tflint = "0.64.0"
actionlint = "1.7.12"
python = "3.13.16"
ruff = "0.16.10"
biome = "2.5.15"
node = "26.11.1"
# Match the Checkov action's bundled version.
"aqua:bridgecrewio/checkov" = "3.3.20"
"aqua:aws/aws-cli" = "2.37.10"

[settings]
lockfile = true

[tasks.fmt]
description = "Check OpenTofu formatting across all roots"
run = "tofu fmt -check -recursive"

[tasks.lint]
description = "Initialize TFLint plugins and lint every OpenTofu root"
run = ['tflint --init --config="$PWD/.tflint.hcl"', 'tflint -f compact --recursive --config="$PWD/.tflint.hcl"']

[tasks.validate]
description = "Initialize and validate every affected OpenTofu root"
run = "python3 scripts/ci/validate_opentofu.py"

[tasks.workflow-lint]
description = "Lint GitHub Actions workflow files"
run = "actionlint .github/workflows/*.yml"

[tasks."lint:python"]
description = "Lint and format-check every tracked Python file with Ruff"
run = """
set -eu
git ls-files -z -- '*.py' | xargs -0 ruff check
git ls-files -z -- '*.py' | xargs -0 ruff format --check
"""

[tasks."fmt:site"]
description = "Check both static sites' HTML, CSS, and JavaScript formatting"
run = "biome format apps/oconnordev/ apps/drumrollworld/"

[tasks."lint:site"]
description = "Lint both static sites' HTML, CSS, and JavaScript"
run = "biome lint --error-on-warnings apps/oconnordev/ apps/drumrollworld/"

[tasks."build:oconnordev"]
description = "Build a minimal resume release with a continuous PDF and local preview"
run = [
  "npm --prefix apps/oconnordev ci --ignore-scripts --no-audit --no-fund",
  'if [ "${CI:-}" = "true" ]; then npm --prefix apps/oconnordev exec --no -- playwright install --with-deps chromium --only-shell; fi',
  "npm --prefix apps/oconnordev run build",
]

[tasks."test:oconnordev"]
description = "Verify resume semantics, metadata, accessibility and actual PDF contents"
run = ["npm --prefix apps/oconnordev test", "SITES=oconnordev node scripts/security/static-site-headers.test.cjs"]

[tasks."build:drumrollworld"]
description = "Install locked packages without lifecycle scripts and build self-hosted assets"
run = [
  "npm --prefix apps/drumrollworld ci --ignore-scripts --no-audit --no-fund",
  'if [ "${CI:-}" = "true" ]; then npm --prefix apps/drumrollworld exec --no -- playwright install --with-deps chromium --only-shell; fi',
  "npm --prefix apps/drumrollworld run build",
]

[tasks."test:drumrollworld"]
description = "Check the generated self-hosted DrumrollWorld release"
run = [
  "npm --prefix apps/drumrollworld run test",
  "node --test scripts/drumrollworld/test/*.test.mjs",
  "SITES=drumrollworld node scripts/security/static-site-headers.test.cjs",
]

[tasks.checkov]
description = "Scan the repository and produce console and SARIF results"
run = "checkov --directory . --output cli --output sarif --output-file-path console,results.sarif"

[tasks."test:python"]
description = "Run adapter, rotation, gateway smoke, and CI path-selection unit tests"
run = '''
set -eu
if [ -n "${HERMES_CI_PYTHON:-}" ]; then
  CI_PYTHON="$HERMES_CI_PYTHON"
else
  CI_ENV="${TMPDIR:-$HOME/.cache}/hermes-ci-test-venv"
  python3 -m venv "$CI_ENV"
  CI_PYTHON="$CI_ENV/bin/python"
  "$CI_PYTHON" -m pip install --disable-pip-version-check --only-binary=:all: --no-deps -r scripts/ci/requirements-test.txt
fi
"$CI_PYTHON" -m unittest discover -s agents/hermes/adapter/test -t agents/hermes/adapter -v
"$CI_PYTHON" -m unittest discover -s infra/aws/tools/lambdas/spacelift_session_token -p 'test_*.py' -v
"$CI_PYTHON" -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v
"$CI_PYTHON" -m unittest discover -s scripts/adapter/test -t . -v
'''

[tasks."test:opentofu-boundary"]
description = "Run the offline OpenTofu AWS boundary tests"
run = """
set -eu
export TF_PLUGIN_CACHE_DIR="${TF_PLUGIN_CACHE_DIR:-$HOME/.opentofu.d/plugin-cache}"
mkdir -p "$TF_PLUGIN_CACHE_DIR"
tofu -chdir=infra/aws/tools init -backend=false -input=false -no-color -lockfile=readonly
tofu -chdir=infra/aws/tools test -no-color
"""

[tasks."test:opentofu-delivery"]
description = "Run offline production DrumrollWorld delivery tests"
run = """
set -eu
export TF_PLUGIN_CACHE_DIR="${TF_PLUGIN_CACHE_DIR:-$HOME/.opentofu.d/plugin-cache}"
mkdir -p "$TF_PLUGIN_CACHE_DIR"
tofu -chdir=infra/aws/drumrollworld init -backend=false -input=false -no-color -lockfile=readonly
tofu -chdir=infra/aws/drumrollworld test -no-color
tofu -chdir=infra/aws/oconnordev init -backend=false -input=false -no-color -lockfile=readonly
tofu -chdir=infra/aws/oconnordev test -no-color
tofu -chdir=infra/aws/production init -backend=false -input=false -no-color -lockfile=readonly
tofu -chdir=infra/aws/production test -no-color
python3 scripts/infra/test_static_site_compatibility.py
"""

[tasks."test:opentofu-gcp"]
description = "Run offline Google project adoption identity tests (not live import evidence)"
run = """
set -eu
export TF_PLUGIN_CACHE_DIR="${TF_PLUGIN_CACHE_DIR:-$HOME/.opentofu.d/plugin-cache}"
mkdir -p "$TF_PLUGIN_CACHE_DIR"
tofu -chdir=infra/gcp/google-auth init -backend=false -input=false -no-color -lockfile=readonly
python3 scripts/ci/verify_gcp_discovery_plan.py
"""

[tasks."test:microsoft365-bootstrap"]
description = "Run owner bootstrap tests with mocked AWS and synthetic MSAL, no owner CLI"
run = [
  "npm ci --prefix infra/aws/tools/lambdas/microsoft365_mcp --ignore-scripts --no-audit --no-fund",
  "npm ci --prefix scripts/bootstrap/microsoft365 --ignore-scripts --no-audit --no-fund",
  "npm test --prefix scripts/bootstrap/microsoft365",
]

[tasks.test]
description = "Run Python, owner bootstrap, and OpenTofu boundary, delivery, and discovery tests"
depends = ["test:python", "test:microsoft365-bootstrap", "test:opentofu-boundary", "test:opentofu-delivery", "test:opentofu-gcp", "test:thundermail-rust", "test:thundermail-sdk"]

[tasks."test:thundermail-rust"]
description = "Locked Rust 1.90 format/tests using explicit isolated toolchain; no cloud/credentials"
run = "python3 infra/aws/tools/lambdas/thundermail_mcp/check.py"

[tasks."test:thundermail-sdk"]
description = "Owned native catalog through adapter and real MCP SDK, in isolated environment"
run = '''
set -eu
if [ -n "${THUNDERMAIL_SDK_PYTHON:-}" ]; then
  SDK_PYTHON="$THUNDERMAIL_SDK_PYTHON"
else
  SDK_ENV="${TMPDIR:-$HOME/.cache}/thundermail-sdk-venv"
  python3 -m venv "$SDK_ENV"
  SDK_PYTHON="$SDK_ENV/bin/python"
  "$SDK_PYTHON" -m pip install --disable-pip-version-check --only-binary=:all: mcp==2.0.0
fi
"$SDK_PYTHON" -c 'from mcp.types import ListToolsResult; assert ListToolsResult'
PYTHONPATH=agents/hermes/adapter "$SDK_PYTHON" -m unittest test.test_thundermail -v
'''
