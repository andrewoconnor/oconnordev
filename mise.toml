[tools]
opentofu = "1.12.6"
tflint = "0.64.0"
actionlint = "1.7.12"
python = "3.13.16"
ruff = "0.16.10"
biome = "2.5.15"
node = "26.11.1"
# Match the Checkov action's bundled version.
"aqua:bridgecrewio/checkov" = "3.3.20"
"aqua:aws/aws-cli" = "2.37.10"

[settings]
lockfile = true

[tasks.fmt]
description = "Check OpenTofu formatting across all roots"
run = "tofu fmt -check -recursive"

[tasks.lint]
description = "Initialize TFLint plugins and lint every OpenTofu root"
run = ["tflint --init", "tflint -f compact --recursive"]

[tasks.validate]
description = "Initialize and validate every affected OpenTofu root"
run = "python3 scripts/ci/validate_opentofu.py"

[tasks.workflow-lint]
description = "Lint GitHub Actions workflow files"
run = "actionlint .github/workflows/*.yml"

[tasks."lint:python"]
description = "Lint and format-check every tracked Python file with Ruff"
run = """
set -eu
git ls-files -z -- '*.py' | xargs -0 ruff check
git ls-files -z -- '*.py' | xargs -0 ruff format --check
"""

[tasks."fmt:site"]
description = "Check both static sites' HTML, CSS, and JavaScript formatting"
run = "biome format apps/oconnordev/ apps/drumrollworld/"

[tasks."lint:site"]
description = "Lint both static sites' HTML, CSS, and JavaScript"
run = "biome lint --error-on-warnings apps/oconnordev/ apps/drumrollworld/"

[tasks."build:drumrollworld"]
description = "Install locked packages without lifecycle scripts and build self-hosted assets"
run = [
  "npm --prefix apps/drumrollworld ci --ignore-scripts --no-audit --no-fund",
  "npm --prefix apps/drumrollworld run build",
]

[tasks."test:drumrollworld"]
description = "Check the generated self-hosted DrumrollWorld release"
run = [
  "npm --prefix apps/drumrollworld run test",
  "node --test scripts/drumrollworld/test/*.test.mjs",
]

[tasks.checkov]
description = "Scan the repository and produce console and SARIF results"
run = "checkov --directory . --output cli --output sarif --output-file-path console,results.sarif"

[tasks."test:python"]
description = "Run adapter, rotation, gateway smoke, and CI path-selection unit tests"
run = [
  "python3 -m unittest discover -s agents/hermes/adapter/test -t agents/hermes/adapter -v",
  "python3 -m unittest discover -s infra/aws/tools/lambdas/spacelift_session_token -p 'test_*.py' -v",
  "python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v",
  "python3 -m unittest discover -s scripts/adapter/test -t . -v",
]

[tasks."test:opentofu-boundary"]
description = "Run the offline OpenTofu AWS boundary tests"
run = """
set -eu
export TF_PLUGIN_CACHE_DIR="${TF_PLUGIN_CACHE_DIR:-$HOME/.opentofu.d/plugin-cache}"
mkdir -p "$TF_PLUGIN_CACHE_DIR"
tofu -chdir=infra/aws/tools init -backend=false -input=false -no-color -lockfile=readonly
tofu -chdir=infra/aws/tools test -no-color
"""

[tasks.test]
description = "Run Python unit tests and OpenTofu boundary tests"
depends = ["test:python", "test:opentofu-boundary"]
