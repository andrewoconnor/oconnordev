version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /apps/oconnordev
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /apps/drumrollworld
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  - package-ecosystem: cargo
    directory: /infra/aws/tools/lambdas/thundermail_mcp
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
