version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /apps/oconnordev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /apps/drumrollworld
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  - package-ecosystem: pip
    directory: /scripts/ci
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  - package-ecosystem: cargo
    directory: /infra/aws/tools/lambdas/thundermail_mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    groups:
      cargo:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
