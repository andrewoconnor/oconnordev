name: Tool image

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      context:
        type: string
        required: true
      dockerfile:
        type: string
        required: true
      test:
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Build and smoke-test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.package.outputs.sha256 }}
      image_id: ${{ steps.package.outputs.image_id }}
    env:
      IMAGE: ${{ inputs.name }}-tested:local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/arm64 image without credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/arm64
          provenance: false
          sbom: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ inputs.name }}-image
          cache-to: ${{ github.ref == 'refs/heads/master' && format('type=gha,mode=max,scope={0}-image', inputs.name) || '' }}
      - name: Verify architecture
        run: test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/arm64
      - name: Test image
        env:
          TEST: ${{ inputs.test }}
        run: bash -c "$TEST"
      - name: Package tested image
        id: package
        run: |
          mkdir release
          docker save "$IMAGE" --output release/image.tar
          printf 'sha256=%s\nimage_id=%s\n' "$(sha256sum release/image.tar | cut -d ' ' -f 1)" "$(docker image inspect --format '{{.Id}}' "$IMAGE")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-${{ github.sha }}
          path: release/image.tar
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish to ECR
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      IMAGE: ${{ inputs.name }}-tested:local
      IMAGE_REPOSITORY: '421680664125.dkr.ecr.us-east-1.amazonaws.com/oconnordev-tools'
      IMAGE_TAG: ${{ inputs.name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      PUBLISHER_ROLE_ARN: arn:aws:iam::421680664125:role/hermes-tools-image-publisher
      TOOLS_ACCOUNT: "421680664125"
    steps:
      - name: Fetch the tested commit with git
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init --quiet .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --quiet --no-tags --depth 1 origin "$SHA"
          git checkout --quiet --detach "$SHA"
      - name: Download this run's tested image
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}-${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/download_run_artifact.sh release
      - name: Load the exact tested image
        env:
          EXPECTED_ARCHIVE: ${{ needs.check.outputs.archive_sha256 }}
          EXPECTED_IMAGE: ${{ needs.check.outputs.image_id }}
        run: |
          printf '%s  release/image.tar\n' "$EXPECTED_ARCHIVE" | sha256sum --check --strict
          docker load --input release/image.tar
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$EXPECTED_IMAGE"
      - name: Push tested image and read back digest
        env:
          INPUT_NAME: ${{ inputs.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          source scripts/ci/aws_oidc.sh
          assume_with_github_oidc "$PUBLISHER_ROLE_ARN" "$INPUT_NAME-image-$RUN_ID" "$TOOLS_ACCOUNT"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "${IMAGE_REPOSITORY%%/*}"
          trap 'docker logout "${IMAGE_REPOSITORY%%/*}"' EXIT
          docker tag "$IMAGE" "$IMAGE_REPOSITORY:$IMAGE_TAG"
          PUSH_DIGEST=$(docker push "$IMAGE_REPOSITORY:$IMAGE_TAG" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -1)
          DIGEST=$(aws ecr describe-images --region us-east-1 --repository-name oconnordev-tools --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          test "$DIGEST" = "$PUSH_DIGEST"
          printf 'Published image (not deployed): %s\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
