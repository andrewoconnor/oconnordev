name: Agent and session-token unit tests

on:
  push:
    branches:
      - "master"
      - "hermes/**"
    paths:
      - 'agents/**'
      - 'infra/aws/tools/spacelift-token-rotation*'
      - '.github/workflows/adapter-tests.yml'
  pull_request:
    branches:
      - "master"
    paths:
      - 'agents/**'
      - 'infra/aws/tools/spacelift-token-rotation*'
      - '.github/workflows/adapter-tests.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read # for actions/checkout to fetch code

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run the adapter tests
        working-directory: agents/hermes/adapter
        run: python3 -m unittest discover -s test -t . -v

      - name: Run the Spacelift session-token rotation tests
        run: python3 -m unittest discover -s agents/hermes/rotation/test -p 'test_*.py' -v
