name: Agent and infrastructure unit tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opentofu.d/plugin-cache
          key: ${{ runner.os }}-opentofu-tests-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-opentofu-tests-

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.10.17'
          github_token: ${{ github.token }}

      - name: Check Python formatting
        run: mise run fmt:python

      - name: Lint Python
        run: mise run lint:python

      - name: Lint shell scripts
        run: mise run lint:shell

      - name: Check Rust formatting
        run: mise run fmt:rust

      - name: Lint Rust
        run: mise run lint:rust

      - name: Run unit and OpenTofu boundary tests
        run: mise run test
