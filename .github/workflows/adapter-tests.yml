name: Agent and infrastructure unit tests

on:
  push:
    branches:
      - master
      - 'hermes/**'
  pull_request:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opentofu.d/plugin-cache
          key: ${{ runner.os }}-opentofu-tests-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-opentofu-tests-

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.3'
          github_token: ${{ github.token }}

      - name: Check Python lint and formatting
        run: mise run lint:python

      - name: Run unit and OpenTofu boundary tests
        run: mise run test
