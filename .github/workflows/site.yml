name: Static site

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      broker_role_arn:
        type: string
        required: true
      deploy_role_arn:
        type: string
        required: true
      distribution_id:
        type: string
        required: true
      url:
        type: string
        required: true

permissions:
  contents: read

env:
  MISE_LOCKED: '1'

jobs:
  check:
    name: Lint, format, build and test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.10.17'
          github_token: ${{ github.token }}
      - name: Check static-site formatting
        run: mise run fmt:site
      - name: Lint static sites
        run: mise run lint:site
      - name: Build the site
        env:
          SITE: ${{ inputs.name }}
        run: mise run "build:$SITE"
      - name: Test the site and the deployment boundary
        env:
          SITE: ${{ inputs.name }}
        run: |
          mise run "test:$SITE"
          mise exec -- python -m unittest scripts.ci.tests.test_static_site_deployment scripts.ci.tests.test_tested_site_artifact scripts.ci.tests.test_site_publication scripts.ci.tests.test_site_freshness scripts.ci.tests.test_site_csp_ci -v

      - name: Package tested public bytes
        id: package
        env:
          SITE: ${{ inputs.name }}
        run: |
          DIGEST=$(mise exec -- python scripts/ci/site_artifact.py pack "apps/$SITE/dist" release/release.tar)
          printf 'sha256=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-${{ github.sha }}
          path: release/release.tar
          if-no-files-found: error
          retention-days: 2

  deploy:
    name: Deploy tested release to S3 and invalidate CloudFront
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    timeout-minutes: 15
    environment: ${{ inputs.name }}-production
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      deployed: ${{ steps.fresh.outputs.deploy }}
    env:
      AWS_REGION: us-east-1
      TOOLS_ACCOUNT: "421680664125"
      PRODUCTION_ACCOUNT: "767397796791"
    steps:
      - name: Fetch the tested commit with git
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init --quiet .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --quiet --no-tags --depth 1 origin "$SHA"
          git checkout --quiet --detach "$SHA"
      - name: Download this run's tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}-${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/download_run_artifact.sh release
      - name: Verify tested artifact before AWS credentials
        env:
          EXPECTED_DIGEST: ${{ needs.check.outputs.sha256 }}
          SITE: ${{ inputs.name }}
        run: python3 scripts/ci/site_artifact.py verify release/release.tar "$EXPECTED_DIGEST" "apps/$SITE/dist"
      - name: Skip stale master before AWS credentials
        id: fresh
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE: ${{ inputs.name }}
        run: python3 scripts/ci/site_freshness.py "$SITE" "$EXPECTED_SHA"
      - name: Require deployment configuration
        if: steps.fresh.outputs.deploy == 'true'
        env:
          BROKER_ROLE_ARN: ${{ inputs.broker_role_arn }}
          DEPLOY_ROLE_ARN: ${{ inputs.deploy_role_arn }}
          DISTRIBUTION_ID: ${{ inputs.distribution_id }}
        run: |
          test -n "$BROKER_ROLE_ARN"
          test -n "$DEPLOY_ROLE_ARN"
          test -n "$DISTRIBUTION_ID"
      - name: Publish through the TOOLS broker and PRODUCTION deploy role
        if: steps.fresh.outputs.deploy == 'true'
        env:
          BROKER_ROLE_ARN: ${{ inputs.broker_role_arn }}
          DEPLOY_ROLE_ARN: ${{ inputs.deploy_role_arn }}
          DISTRIBUTION_ID: ${{ inputs.distribution_id }}
          RUN_ID: ${{ github.run_id }}
          SITE: ${{ inputs.name }}
        run: |
          set -euo pipefail
          source scripts/ci/aws_oidc.sh
          assume_with_github_oidc "$BROKER_ROLE_ARN" "$SITE-site-broker-$RUN_ID" "$TOOLS_ACCOUNT"
          assume_chained_role "$DEPLOY_ROLE_ARN" "$SITE-site-$RUN_ID" "$PRODUCTION_ACCOUNT"
          bash scripts/ci/publish_site.sh "apps/$SITE/dist" "$SITE-web"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

  verify:
    name: Verify the live site serves the tested release
    if: needs.deploy.outputs.deployed == 'true'
    needs: [check, deploy]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: '2026.10.17'
          github_token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.name }}-${{ github.sha }}
          path: release
      - name: Extract the tested release
        env:
          EXPECTED_DIGEST: ${{ needs.check.outputs.sha256 }}
          SITE: ${{ inputs.name }}
        run: mise exec -- python scripts/ci/site_artifact.py verify release/release.tar "$EXPECTED_DIGEST" "apps/$SITE/dist"
      - name: Compare live files and headers with the tested release
        env:
          SITE: ${{ inputs.name }}
          URL: ${{ inputs.url }}
        run: mise exec -- python scripts/ci/verify_live_site.py "$SITE" "$URL" "apps/$SITE/dist"
      - name: Install the locked browser
        env:
          SITE: ${{ inputs.name }}
        run: |
          npm --prefix "apps/$SITE" ci --ignore-scripts --no-audit --no-fund
          npm --prefix "apps/$SITE" exec --no -- playwright install --with-deps chromium --only-shell
      - name: Load the live site in Chromium
        env:
          SITE: ${{ inputs.name }}
          URL: ${{ inputs.url }}
        run: mise exec -- node scripts/ci/live_site_browser.cjs "$SITE" "$URL"

  alert:
    name: Open an issue when the live check fails
    if: always() && needs.verify.result == 'failure'
    needs: verify
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue for this site
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          SITE: ${{ inputs.name }}
          URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          title="Live site check failed: $SITE"
          body=$(printf '%s\n\n- Commit: %s\n- Site: %s\n- Run: %s\n' \
            "The deploy finished, but the live site did not match the tested release or did not render." \
            "$SHA" "$URL" "$RUN_URL")
          existing=$(gh issue list --repo "$REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
            | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "$title" --assignee "$OWNER" --body "$body"
          fi
