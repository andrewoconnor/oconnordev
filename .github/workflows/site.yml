name: Static site

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      broker_role_arn:
        type: string
        required: true
      deploy_role_arn:
        type: string
        required: true
      distribution_id:
        type: string
        required: true

permissions:
  contents: read

env:
  MISE_LOCKED: '1'

jobs:
  check:
    name: Lint, format, build and test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.10.17'
          github_token: ${{ github.token }}
      - name: Check static-site formatting
        run: mise run fmt:site
      - name: Lint static sites
        run: mise run lint:site
      - name: Build the site
        env:
          SITE: ${{ inputs.name }}
        run: mise run "build:$SITE"
      - name: Test the site and the deployment boundary
        env:
          SITE: ${{ inputs.name }}
        run: |
          mise run "test:$SITE"
          mise exec -- python -m unittest scripts.ci.tests.test_static_site_deployment scripts.ci.tests.test_tested_site_artifact scripts.ci.tests.test_site_publication scripts.ci.tests.test_site_freshness scripts.ci.tests.test_site_csp_ci -v

      - name: Package tested public bytes
        id: package
        env:
          SITE: ${{ inputs.name }}
        run: |
          DIGEST=$(mise exec -- python scripts/ci/site_artifact.py pack "apps/$SITE/dist" release/release.tar)
          printf 'sha256=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-${{ github.sha }}
          path: release/release.tar
          if-no-files-found: error
          retention-days: 2

  deploy:
    name: Deploy tested release to S3 and invalidate CloudFront
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    timeout-minutes: 15
    environment: ${{ inputs.name }}-production
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      TOOLS_ACCOUNT: "421680664125"
      PRODUCTION_ACCOUNT: "767397796791"
    steps:
      - name: Fetch the tested commit with git
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init --quiet .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --quiet --no-tags --depth 1 origin "$SHA"
          git checkout --quiet --detach "$SHA"
      - name: Download this run's tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}-${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/download_run_artifact.sh release
      - name: Verify tested artifact before AWS credentials
        env:
          EXPECTED_DIGEST: ${{ needs.check.outputs.sha256 }}
          SITE: ${{ inputs.name }}
        run: python3 scripts/ci/site_artifact.py verify release/release.tar "$EXPECTED_DIGEST" "apps/$SITE/dist"
      - name: Skip stale master before AWS credentials
        id: fresh
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE: ${{ inputs.name }}
        run: python3 scripts/ci/site_freshness.py "$SITE" "$EXPECTED_SHA"
      - name: Require deployment configuration
        if: steps.fresh.outputs.deploy == 'true'
        env:
          BROKER_ROLE_ARN: ${{ inputs.broker_role_arn }}
          DEPLOY_ROLE_ARN: ${{ inputs.deploy_role_arn }}
          DISTRIBUTION_ID: ${{ inputs.distribution_id }}
        run: |
          test -n "$BROKER_ROLE_ARN"
          test -n "$DEPLOY_ROLE_ARN"
          test -n "$DISTRIBUTION_ID"
      - name: Publish through the TOOLS broker and PRODUCTION deploy role
        if: steps.fresh.outputs.deploy == 'true'
        env:
          BROKER_ROLE_ARN: ${{ inputs.broker_role_arn }}
          DEPLOY_ROLE_ARN: ${{ inputs.deploy_role_arn }}
          DISTRIBUTION_ID: ${{ inputs.distribution_id }}
          RUN_ID: ${{ github.run_id }}
          SITE: ${{ inputs.name }}
        run: |
          set -euo pipefail
          source scripts/ci/aws_oidc.sh
          assume_with_github_oidc "$BROKER_ROLE_ARN" "$SITE-site-broker-$RUN_ID" "$TOOLS_ACCOUNT"
          assume_chained_role "$DEPLOY_ROLE_ARN" "$SITE-site-$RUN_ID" "$PRODUCTION_ACCOUNT"
          bash scripts/ci/publish_site.sh "apps/$SITE/dist" "$SITE-web"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
