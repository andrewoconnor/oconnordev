name: Microsoft365 owner bootstrap secretless tests

on:
  push:
    branches: [master, 'hermes/**']
    paths:
      - 'scripts/bootstrap/microsoft365/**'
      - 'infra/aws/tools/lambdas/microsoft365_mcp/**'
      - '.github/workflows/microsoft365-bootstrap.yml'
      - 'mise.toml'
  pull_request:
    branches: [master]
    paths:
      - 'scripts/bootstrap/microsoft365/**'
      - 'infra/aws/tools/lambdas/microsoft365_mcp/**'
      - '.github/workflows/microsoft365-bootstrap.yml'
      - 'mise.toml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install both locked dependency scopes without lifecycle scripts
        run: |
          npm ci --prefix infra/aws/tools/lambdas/microsoft365_mcp --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/bootstrap/microsoft365 --ignore-scripts --no-audit --no-fund
      - name: Test mocked AWS and synthetic MSAL only, never run owner CLI
        run: npm test --prefix scripts/bootstrap/microsoft365
