name: checkov

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# Least privilege at the workflow level. Without a top-level block the token
# falls back to the repository default (write-all), which is what Checkov
# CKV2_GHA_1 reports; a job-level block does not satisfy that check. The scan
# job widens this only for the SARIF upload.
permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.3'
          github_token: ${{ github.token }}

      - name: Scan with mise-managed Checkov
        run: mise run checkov

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: success() || failure()
        with:
          sarif_file: results.sarif
