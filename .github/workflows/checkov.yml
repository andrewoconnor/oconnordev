name: checkov

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# Least privilege at the workflow level. Without a top-level block the token
# falls back to the repository default (write-all), which is what Checkov
# CKV2_GHA_1 reports; a job-level block does not satisfy that check. The scan
# job widens this only for the SARIF upload.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: '2026.10.17'
          github_token: ${{ github.token }}

      - name: Scan with mise-managed Checkov
        run: mise run checkov

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: success() || failure()
        with:
          sarif_file: results.sarif
