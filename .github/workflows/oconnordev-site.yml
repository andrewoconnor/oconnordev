name: oconnordev site

on:
  push:
    branches:
      - master
    paths:
      - "apps/oconnordev/**"
      - "infra/aws/*/site.tf"
      - "infra/modules/static-site/**"
      - "scripts/security/**"
      - ".github/workflows/oconnordev-site.yml"
      - ".github/workflows/site.yml"
      - "biome.json"
      - "scripts/ci/**"
      - "mise.toml"
      - "mise.lock"
  pull_request:
    branches:
      - master
    paths:
      - "apps/oconnordev/**"
      - "infra/aws/*/site.tf"
      - "infra/modules/static-site/**"
      - "scripts/security/**"
      - ".github/workflows/oconnordev-site.yml"
      - ".github/workflows/site.yml"
      - "biome.json"
      - "scripts/ci/**"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oconnordev-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oconnordev:
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
      id-token: write
    with:
      name: oconnordev
      broker_role_arn: ${{ vars.OCONNORDEV_TOOLS_GITHUB_ACTIONS_BROKER_ROLE_ARN }}
      deploy_role_arn: ${{ vars.OCONNORDEV_SITE_DEPLOY_ROLE_ARN }}
      distribution_id: ${{ vars.OCONNORDEV_CLOUDFRONT_DISTRIBUTION_ID }}
