name: oconnordev site

on:
  push:
    branches:
      - master
    paths:
      - "apps/oconnordev/**"
      - "infra/aws/*/site.tf"
      - "infra/modules/static-site/**"
      - "scripts/security/**"
      - "scripts/ci/tests/test_static_site_deployment.py"
      - ".github/workflows/oconnordev-site.yml"
      - "biome.json"
      - "scripts/ci/**"
      - "mise.toml"
      - "mise.lock"
  pull_request:
    branches:
      - master
    paths:
      - "apps/oconnordev/**"
      - "infra/aws/*/site.tf"
      - "infra/modules/static-site/**"
      - "scripts/security/**"
      - "scripts/ci/tests/test_static_site_deployment.py"
      - ".github/workflows/oconnordev-site.yml"
      - "biome.json"
      - "scripts/ci/**"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: '1'

concurrency:
  group: oconnordev-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint, format, build and test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.3'
          github_token: ${{ github.token }}
      - name: Check static-site formatting
        run: mise run fmt:site
      - name: Lint static sites
        run: mise run lint:site
      - name: Build continuous PDF and self-hosted preview
        run: mise run build:oconnordev
      - name: Test resume, PDF and deployment boundary
        run: |
          mise run test:oconnordev
          mise exec -- python -m unittest scripts.ci.tests.test_static_site_deployment scripts.ci.tests.test_tested_site_artifact scripts.ci.tests.test_site_publication scripts.ci.tests.test_site_freshness scripts.ci.tests.test_site_csp_ci -v

      - name: Package tested public bytes
        id: package
        run: |
          DIGEST=$(mise exec -- python scripts/ci/site_artifact.py pack apps/oconnordev/dist release/release.tar)
          printf 'sha256=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oconnordev-${{ github.sha }}
          path: release/release.tar
          if-no-files-found: error
          retention-days: 2

  deploy:
    name: Deploy tested release to S3 and invalidate CloudFront
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    timeout-minutes: 15
    environment: oconnordev-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.3'
          github_token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oconnordev-${{ github.sha }}
          path: release
      - name: Verify tested artifact before AWS credentials
        env:
          EXPECTED_DIGEST: ${{ needs.check.outputs.sha256 }}
        run: mise exec -- python scripts/ci/site_artifact.py verify release/release.tar "$EXPECTED_DIGEST" apps/oconnordev/dist
      - name: Reject stale master before AWS credentials
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: mise exec -- python scripts/ci/site_freshness.py oconnordev "$EXPECTED_SHA"
      - name: Require deployment configuration
        env:
          BROKER_ROLE_ARN: ${{ vars.OCONNORDEV_TOOLS_GITHUB_ACTIONS_BROKER_ROLE_ARN }}
          DEPLOY_ROLE_ARN: ${{ vars.OCONNORDEV_SITE_DEPLOY_ROLE_ARN }}
          DISTRIBUTION_ID: ${{ vars.OCONNORDEV_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$BROKER_ROLE_ARN"
          test -n "$DEPLOY_ROLE_ARN"
          test -n "$DISTRIBUTION_ID"
      - name: Assume TOOLS GitHub Actions broker with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.OCONNORDEV_TOOLS_GITHUB_ACTIONS_BROKER_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: oconnordev-site-broker-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: "421680664125"
      - name: Assume PRODUCTION site deploy role from TOOLS broker
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.OCONNORDEV_SITE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: oconnordev-site-${{ github.run_id }}
          role-duration-seconds: 900
          role-chaining: true
          role-skip-session-tagging: true
          allowed-account-ids: "767397796791"
      - name: Publish tested bytes once with explicit cache metadata
        run: mise exec -- bash scripts/ci/publish_site.sh apps/oconnordev/dist oconnordev-web
      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.OCONNORDEV_CLOUDFRONT_DISTRIBUTION_ID }}
        run: mise exec -- aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
