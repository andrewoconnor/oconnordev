name: oconnordev site

on:
  push:
    branches:
      - master
    paths:
      - "apps/oconnordev/**"
      - "scripts/ci/tests/test_static_site_deployment.py"
      - ".github/workflows/oconnordev-site.yml"
      - "biome.json"
      - "mise.toml"
      - "mise.lock"
  pull_request:
    branches:
      - master
    paths:
      - "apps/oconnordev/**"
      - "scripts/ci/tests/test_static_site_deployment.py"
      - ".github/workflows/oconnordev-site.yml"
      - "biome.json"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: '1'

concurrency:
  group: oconnordev-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Lint, format, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.3'
          github_token: ${{ github.token }}
      - name: Check static-site formatting
        run: mise run fmt:site
      - name: Lint static sites
        run: mise run lint:site
      - name: Build continuous PDF and self-hosted preview
        run: mise run build:oconnordev
      - name: Test resume, PDF and deployment boundary
        run: |
          mise run test:oconnordev
          mise exec -- python -m unittest scripts.ci.tests.test_static_site_deployment -v

  deploy:
    name: Deploy to S3 and invalidate CloudFront
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: format
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: master
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.3'
          github_token: ${{ github.token }}
      - name: Check static-site formatting
        run: mise run fmt:site
      - name: Lint static sites
        run: mise run lint:site
      - name: Build continuous PDF and self-hosted preview
        run: mise run build:oconnordev
      - name: Test resume, PDF and deployment boundary
        run: |
          mise run test:oconnordev
          mise exec -- python -m unittest scripts.ci.tests.test_static_site_deployment -v
      - name: Assume TOOLS GitHub Actions broker with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.OCONNORDEV_TOOLS_GITHUB_ACTIONS_BROKER_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: oconnordev-site-broker-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: "421680664125"
      - name: Assume PRODUCTION site deploy role from TOOLS broker
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.OCONNORDEV_SITE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: oconnordev-site-${{ github.run_id }}
          role-duration-seconds: 900
          role-chaining: true
          role-skip-session-tagging: true
          allowed-account-ids: "767397796791"
      - name: Publish versioned CSS before the HTML (retain previous releases)
        run: mise exec -- aws s3 sync apps/oconnordev/dist/assets/css/ s3://oconnordev-web/assets/css/
      - name: Sync site to S3 (preserve prior hashed CSS for cached HTML)
        run: mise exec -- aws s3 sync apps/oconnordev/dist/ s3://oconnordev-web --delete --exclude "assets/css/*"
      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.OCONNORDEV_CLOUDFRONT_DISTRIBUTION_ID }}
        run: mise exec -- aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
