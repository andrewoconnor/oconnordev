name: oconnordev site

on:
  push:
    branches:
      - master
    paths:
      - "apps/oconnordev/**"
  pull_request:
    branches:
      - master
    paths:
      - "apps/oconnordev/**"
      - ".github/workflows/oconnordev-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Format HTML and CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Check HTML and CSS formatting
        run: deno fmt --check apps/oconnordev/

  deploy:
    name: Deploy to S3 and invalidate CloudFront
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: format
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Check HTML and CSS formatting
        run: deno fmt --check apps/oconnordev/
      - name: Assume TOOLS GitHub Actions broker with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.OCONNORDEV_TOOLS_GITHUB_ACTIONS_BROKER_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: oconnordev-site-broker-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: "421680664125"
      - name: Assume PRODUCTION site deploy role from TOOLS broker
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.OCONNORDEV_SITE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: oconnordev-site-${{ github.run_id }}
          role-duration-seconds: 900
          role-chaining: true
          role-skip-session-tagging: true
          allowed-account-ids: "767397796791"
      - name: Sync site to S3
        run: aws s3 sync apps/oconnordev/ s3://oconnordev-web --delete
      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.OCONNORDEV_CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"