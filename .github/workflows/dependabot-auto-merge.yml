name: Dependabot auto-merge

on:
  pull_request_target:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    name: Enable auto-merge for Dependabot
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - id: policy
        name: Skip actions that pull request CI never runs
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          UNTESTED_BEFORE_MERGE: >-
            actions/create-github-app-token actions/download-artifact
            aws-actions/configure-aws-credentials dependabot/fetch-metadata
        run: |
          eligible=true
          for name in $(printf '%s' "$DEPENDENCY_NAMES" | tr ',' ' '); do
            for untested in $UNTESTED_BEFORE_MERGE; do
              if [ "$name" = "$untested" ]; then
                eligible=false
                printf '%s never runs in pull request CI, so it needs a manual merge.\n' "$name" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
          printf 'eligible=%s\n' "$eligible" >> "$GITHUB_OUTPUT"
      - id: app-token
        if: steps.policy.outputs.eligible == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEPENDABOT_AUTO_MERGE_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTO_MERGE_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Merge once every required check passes
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
