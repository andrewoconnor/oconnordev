name: drumrollworld site

on:
  push:
    branches:
      - master
    paths:
      - "apps/drumrollworld/**"
      - "scripts/drumrollworld/**"
      - "docs/assets/drumrollworld-published-assets.json"
      - ".github/workflows/drumrollworld-site.yml"
      - "biome.json"
      - "mise.toml"
      - "mise.lock"
  pull_request:
    branches:
      - master
    paths:
      - "apps/drumrollworld/**"
      - "scripts/drumrollworld/**"
      - "docs/assets/drumrollworld-published-assets.json"
      - ".github/workflows/drumrollworld-site.yml"
      - "biome.json"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: '1'

concurrency:
  group: drumrollworld-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint, format, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.3'
          github_token: ${{ github.token }}
      - name: Check static-site formatting
        run: mise run fmt:site
      - name: Lint static sites
        run: mise run lint:site
      - name: Build self-hosted site and dependencies
        run: mise run build:drumrollworld
      - name: Test generated site assets
        run: mise run test:drumrollworld

  deploy:
    name: Deploy to S3 and invalidate CloudFront
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: master
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.3'
          github_token: ${{ github.token }}
      - name: Check static-site formatting
        run: mise run fmt:site
      - name: Lint static sites
        run: mise run lint:site
      - name: Build self-hosted site and dependencies
        run: mise run build:drumrollworld
      - name: Test generated site assets
        run: mise run test:drumrollworld
      - name: Require deployment configuration
        env:
          BROKER_ROLE_ARN: ${{ vars.OCONNORDEV_TOOLS_GITHUB_ACTIONS_BROKER_ROLE_ARN }}
          DEPLOY_ROLE_ARN: ${{ vars.DRUMROLLWORLD_SITE_DEPLOY_ROLE_ARN }}
          DISTRIBUTION_ID: ${{ vars.DRUMROLLWORLD_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$BROKER_ROLE_ARN"
          test -n "$DEPLOY_ROLE_ARN"
          test -n "$DISTRIBUTION_ID"
      - name: Assume TOOLS GitHub Actions broker with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.OCONNORDEV_TOOLS_GITHUB_ACTIONS_BROKER_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: drumrollworld-site-broker-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: "421680664125"
      - name: Assume PRODUCTION site deploy role from TOOLS broker
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DRUMROLLWORLD_SITE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: drumrollworld-site-${{ github.run_id }}
          role-duration-seconds: 900
          role-chaining: true
          role-skip-session-tagging: true
          allowed-account-ids: "767397796791"
      - name: Repair existing globe KTX2 content type without uploading images
        run: |
          mise exec -- aws s3 cp s3://drumrollworld-web/images/globe/ s3://drumrollworld-web/images/globe/ --recursive --exclude "*" --include "*.ktx2" --metadata-directive REPLACE --content-type "image/ktx2" --cache-control "public,max-age=0,must-revalidate"
      - name: Publish runtime assets before the HTML with explicit cache metadata
        run: |
          mise exec -- aws s3 sync apps/drumrollworld/dist/assets/ s3://drumrollworld-web/assets/ --cache-control "public,max-age=0,must-revalidate"
          # cp also updates unchanged objects: sync alone skips their metadata.
          mise exec -- aws s3 cp apps/drumrollworld/dist/assets/ s3://drumrollworld-web/assets/ --recursive --cache-control "public,max-age=0,must-revalidate"
          # Only esbuild's content-hashed entry is immutable. Version labels on
          # Basis, the SVG and linked notices are not a content-address guarantee.
          for asset in apps/drumrollworld/dist/assets/main-????????.js; do
            if [[ "$asset" =~ /main-[A-Z0-9]{8}\.js$ ]] && [[ -f "$asset" ]]; then
              mise exec -- aws s3 cp "$asset" "s3://drumrollworld-web/assets/${asset##*/}" --content-type "application/javascript" --cache-control "public,max-age=31536000,immutable"
            fi
          done
      - name: Sync site code to S3 (preserve images and prior runtime assets)
        run: |
          mise exec -- aws s3 sync apps/drumrollworld/dist/ s3://drumrollworld-web/ --delete --exclude "images/*" --exclude "assets/*" --exclude "build-meta.json" --cache-control "public,max-age=0,must-revalidate"
          mise exec -- aws s3 cp apps/drumrollworld/dist/ s3://drumrollworld-web/ --recursive --exclude "images/*" --exclude "assets/*" --exclude "build-meta.json" --cache-control "public,max-age=0,must-revalidate"
          # Excluded destination keys are protected from sync --delete; remove
          # only this legacy diagnostic object, never any images or old bundles.
          mise exec -- aws s3 rm s3://drumrollworld-web/build-meta.json
      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.DRUMROLLWORLD_CLOUDFRONT_DISTRIBUTION_ID }}
        run: mise exec -- aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
