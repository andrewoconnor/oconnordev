name: drumrollworld site

on:
  push:
    branches:
      - master
    paths:
      - "apps/drumrollworld/**"
      - "infra/aws/*/site.tf"
      - "infra/modules/static-site/**"
      - "scripts/security/**"
      - "scripts/drumrollworld/**"
      - "docs/assets/drumrollworld-published-assets.json"
      - ".github/workflows/drumrollworld-site.yml"
      - ".github/workflows/site.yml"
      - "biome.json"
      - "scripts/ci/**"
      - "mise.toml"
      - "mise.lock"
  pull_request:
    branches:
      - master
    paths:
      - "apps/drumrollworld/**"
      - "infra/aws/*/site.tf"
      - "infra/modules/static-site/**"
      - "scripts/security/**"
      - "scripts/drumrollworld/**"
      - "docs/assets/drumrollworld-published-assets.json"
      - ".github/workflows/drumrollworld-site.yml"
      - ".github/workflows/site.yml"
      - "biome.json"
      - "scripts/ci/**"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drumrollworld-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drumrollworld:
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
      id-token: write
    with:
      name: drumrollworld
      broker_role_arn: ${{ vars.DRUMROLLWORLD_TOOLS_GITHUB_ACTIONS_BROKER_ROLE_ARN }}
      deploy_role_arn: ${{ vars.DRUMROLLWORLD_SITE_DEPLOY_ROLE_ARN }}
      distribution_id: ${{ vars.DRUMROLLWORLD_CLOUDFRONT_DISTRIBUTION_ID }}
