name: Thundermail image

on:
  push:
    branches: [master, 'hermes/**']
    paths:
      - 'infra/aws/tools/lambdas/thundermail_mcp/**'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/thundermail-image.yml'
      - '.github/workflows/tool-image.yml'
  pull_request:
    branches: [master]
    paths:
      - 'infra/aws/tools/lambdas/thundermail_mcp/**'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/thundermail-image.yml'
      - '.github/workflows/tool-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thundermail-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/tool-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      name: thundermail
      context: .
      dockerfile: infra/aws/tools/lambdas/thundermail_mcp/Dockerfile
      test: python3 infra/aws/tools/lambdas/thundermail_mcp/native_smoke.py "$IMAGE"
