name: OpenTofu validation

on:
  push:
    branches:
      - 'hermes/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Format, workflow lint, and affected-root validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-opentofu-validate-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-opentofu-validate-

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.3'
          github_token: ${{ github.token }}

      - name: Show OpenTofu version
        run: tofu version

      - name: Check Terraform formatting
        run: mise run fmt

      - name: Lint workflow files
        run: mise run workflow-lint

      - name: Validate changed Terraform roots
        run: mise run validate
