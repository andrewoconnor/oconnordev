name: Terraform validation

on:
  push:
    branches:
      - 'hermes/**'
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-validate.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate changed Terraform roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF}"
          else
            base_ref="origin/master"
          fi
          changed_files="$(git diff --name-only "${base_ref}...HEAD")"
          roots=(
            infra/aws/general
            infra/aws/security
            infra/aws/tools
            infra/aws/production
            infra/aws/drumrollworld
            infra/spacelift
            infra/github/oconnordev
          )
          checked=0
          for root in "${roots[@]}"; do
            root_changed=0
            while IFS= read -r file; do
              if [[ "$file" == "$root/"* ]]; then
                root_changed=1
                break
              fi
            done <<< "$changed_files"
            if [[ "$root_changed" -eq 1 ]]; then
              echo "Validating $root"
              if [[ -f "$root/.terraform.lock.hcl" ]]; then
                terraform -chdir="$root" init -backend=false -input=false -no-color -lockfile=readonly
              else
                terraform -chdir="$root" init -backend=false -input=false -no-color
              fi
              terraform -chdir="$root" validate -no-color
              checked=1
            fi
          done
          if [[ "$checked" -eq 0 ]]; then
            echo "No Terraform root changed; formatting check completed."
          fi
