name: Microsoft365 image

on:
  push:
    branches: [master, 'hermes/**']
    paths:
      - 'infra/aws/tools/lambdas/microsoft365_mcp/**'
      - '.github/workflows/microsoft365-image.yml'
      - '.github/workflows/tool-image.yml'
  pull_request:
    branches: [master]
    paths:
      - 'infra/aws/tools/lambdas/microsoft365_mcp/**'
      - '.github/workflows/microsoft365-image.yml'
      - '.github/workflows/tool-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsoft365-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/tool-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      name: microsoft365
      context: infra/aws/tools/lambdas/microsoft365_mcp
      dockerfile: infra/aws/tools/lambdas/microsoft365_mcp/Dockerfile
      test: >-
        docker run --rm --network none
        --mount type=bind,source="$PWD/infra/aws/tools/lambdas/microsoft365_mcp/test",target=/app/test,readonly
        --entrypoint npm "$IMAGE" test
