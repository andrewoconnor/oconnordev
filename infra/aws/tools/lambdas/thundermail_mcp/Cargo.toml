[package]
name = "thundermail-native-read"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[dependencies]
lambda_runtime = "=0.14.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.47.1", features = ["macros", "rt", "time", "net", "io-util"] }
async-imap = { version = "=0.11.2", default-features = false, features = ["runtime-tokio"] }
futures = "=0.3.32"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "=1.14.0"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.6"

aws-sdk-secretsmanager = { version = "=1.99.0", default-features = false, features = ["rt-tokio"] }
aws-credential-types = "=1.2.11"
aws-smithy-http-client = { version = "=1.1.9", default-features = false, features = ["rustls-ring"] }

[dev-dependencies]
aws-smithy-http-client = { version = "=1.1.9", default-features = false, features = ["test-util"] }
aws-smithy-types = "=1.4.3"
http = "=1.4.0"

[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
