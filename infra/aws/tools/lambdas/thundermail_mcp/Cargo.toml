[package]
name = "thundermail-native-read"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[dependencies]
lambda_runtime = "=1.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt", "time", "net", "io-util"] }
async-imap = { version = "=0.12.0", default-features = false, features = ["runtime-tokio"] }
futures = "=0.3.34"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "=1.15.1"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.11"

aws-sdk-secretsmanager = { version = "=1.99.0", default-features = false, features = ["rt-tokio"] }
aws-credential-types = "=1.2.14"
aws-smithy-http-client = { version = "=1.1.13", default-features = false, features = ["rustls-ring"] }
base64 = "=0.23.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
roxmltree = "=0.21.2"

[dev-dependencies]
aws-smithy-http-client = { version = "=1.1.13", default-features = false, features = ["test-util"] }
aws-smithy-types = "=1.9.1"
http = "=1.5.0"

[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
